name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with project.godot (config/features) and README.md.
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Import and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Test the gh-pages publish scripts
        run: bash .github/scripts/test-publish-gh-pages.sh

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --path . --import

      - name: Run gdUnit4 tests
        run: godot --headless --path . -s -d res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gdunit4-report
          path: reports/
          retention-days: 7

  build-web:
    name: Web export
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: "true"

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Report build size
        run: |
          {
            echo "### Web build size"
            echo
            echo '```'
            du -ah build/web | sort -k2
            echo
            echo "total: $(du -sh build/web | cut -f1)"
            echo "gzipped total: $(tar -C build/web -czf - . | wc -c | numfmt --to=iec)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7

  # Pages deploys from the gh-pages branch: main owns the root, PR previews live under
  # pr/<n>/<sha7>/. Every write goes through publish-gh-pages.sh in the gh-pages group.
  publish-main:
    name: Publish main to gh-pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-gh-pages.sh main build/web
