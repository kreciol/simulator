name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with project.godot (config/features) and README.md.
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Import and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --path . --import

      - name: Run gdUnit4 tests
        run: godot --headless --path . -s -d res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gdunit4-report
          path: reports/
          retention-days: 7

  build-web:
    name: Web export
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: "true"

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Report build size
        run: |
          {
            echo "### Web build size"
            echo
            echo '```'
            du -ah build/web | sort -k2
            echo
            echo "total: $(du -sh build/web | cut -f1)"
            echo "gzipped total: $(tar -C build/web -czf - . | wc -c | numfmt --to=iec)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
